# Render Blueprint — render.com/docs/blueprint-spec
#
# TEK web servisi. Cron job YOKTUR.
#
# Neden: Render'da (1) kalıcı disk yalnızca TEK servise bağlanabilir,
# (2) cron job servis türüne disk hiç bağlanamaz. Web + cron'un aynı
# data/*.csv ve data/monitor.db dosyalarını paylaşması bu yüzden imkânsız.
# Pipeline, web sürecinin içinde APScheduler ile arka plan thread'inde
# çalışır (app.py). 20/21 interaktif script'ler Render'a girmez.
#
# Kullanım: Render dashboard'da "New -> Blueprint" seçip bu repoyu gösterin.

services:
  - type: web
    name: health-misinfo-dashboard
    runtime: python
    plan: starter                     # kalıcı disk için ücretsiz planda mümkün değil
    # Build, disk bindirmeden ÖNCE git'teki gerçek CSV + deploy_seed/monitor.db
    # snapshot'ını data_seed/'e alır. Start'ta boş disk data/'yı örter; eksik
    # dosyalar snapshot'tan bir kez kopyalanır (demo tohum değil, yerel analiz).
    # Diskte dosya zaten varsa üzerine yazılmaz. workers=1: tek zamanlayıcı.
    buildCommand: "pip install -r requirements.txt && mkdir -p data_seed && cp -f data/channels.csv data/videos.csv data/claim_index.csv data/claim_archive.csv data/suspects.csv data/narrative_clusters.csv data/watchlist.json data_seed/ && cp -f deploy_seed/monitor.db data_seed/monitor.db"
    startCommand: "sh scripts/seed_render_disk.sh"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PIPELINE_INTERVAL_HOURS
        value: "24"
      - key: PIPELINE_INITIAL_DELAY_SECONDS
        value: "120"
      - key: PIPELINE_SCHEDULER_ENABLED
        value: "1"
      - key: ANTHROPIC_API_KEY
        sync: false                    # Render dashboard'dan elle girilecek, koda yazılmayacak
      - key: YOUTUBE_API_KEY
        sync: false
    disk:
      name: health-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
